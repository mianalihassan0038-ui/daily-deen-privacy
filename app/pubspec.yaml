name: dailydeen
description: "Daily Deen - Islamic daily routine, Namaz, Quran and Azkar tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F7B4A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
