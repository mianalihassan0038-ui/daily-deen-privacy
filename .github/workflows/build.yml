name: Build & Test Daily Deen

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: |
          flutter create --org com.aurialtech --project-name dailydeen --platforms android .
          python3 tool/patch_android.py

      - name: Install packages
        run: |
          flutter pub get
          flutter pub deps --style=compact --no-dev | grep -E '^- ' | head -80

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test test/logic_test.dart test/widget_test.dart

      - name: Store screenshots
        continue-on-error: true
        run: flutter test --update-goldens test/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: app/test/screenshots/goldens/
          if-no-files-found: ignore

      # Release signing: add two repository secrets
      #   KEYSTORE_BASE64   = base64 of keys/upload-keystore.jks
      #   KEYSTORE_PASSWORD = keystore / key password (alias "upload")
      # Without them the APK/AAB are signed with a debug key (fine for testing,
      # not accepted by Google Play).
      - name: Release signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p keys
            echo "$KEYSTORE_BASE64" | base64 -d > keys/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=upload"
              echo "storeFile=../../keys/upload-keystore.jks"
            } > android/key.properties
            echo "Release signing enabled"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets not set - building with debug signing"
          fi

      - name: Build APK
        run: flutter build apk --release --build-number=$((100 + ${{ github.run_number }}))

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --build-number=$((100 + ${{ github.run_number }}))

      - uses: actions/upload-artifact@v4
        with:
          name: daily-deen-release-${{ github.run_number }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
